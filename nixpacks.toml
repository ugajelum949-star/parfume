# Node + sharp native deps
[phases.setup]
nixPkgs = ["nodejs_22", "python311", "gcc"]

[phases.install]
cmds = ["npm ci --prefer-offline"]

[start]
cmd = "node .next/standalone/server.js"

[env]
PORT = "3000"
HOSTNAME = "0.0.0.0"
NODE_ENV = "production"
NODE_OPTIONS = "--max-old-space-size=2048"
NIXPACKS_NODE_VERSION = "22.15.0"
